server:
  port: 8081

spring:
  application:
    name: totp-backend
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Emetteur et compte affiches dans l'application d'authentification.
totp:
  issuer: OPT-NC
  account-name: demo

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
