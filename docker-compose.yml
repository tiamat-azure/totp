services:

  backend:
    build: ./backend
    container_name: totp-backend
    # Non publie sur l'hote : seul nginx y accede, via le reseau interne.
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: totp-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
